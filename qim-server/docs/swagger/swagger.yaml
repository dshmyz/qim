basePath: /api/v1
definitions:
  ai.Message:
    properties:
      content:
        type: string
      image_url:
        type: string
      name:
        type: string
      role:
        type: string
      tool_call_id:
        type: string
      tool_calls:
        items:
          $ref: '#/definitions/ai.ToolCall'
        type: array
    type: object
  ai.ToolCall:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  handler.AIResponse:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  handler.DraftReplyRequest:
    properties:
      conversation_id:
        type: integer
      message_id:
        type: integer
    required:
    - conversation_id
    - message_id
    type: object
  handler.GenerateSummaryRequest:
    properties:
      conversation_id:
        type: integer
      end_time:
        type: string
      start_time:
        type: string
      time_range:
        description: '"1h", "today", "7d", "custom"'
        type: string
    required:
    - conversation_id
    type: object
  handler.GetCompletionRequest:
    properties:
      messages:
        items:
          $ref: '#/definitions/ai.Message'
        type: array
    required:
    - messages
    type: object
  handler.SidebarStreamRequest:
    properties:
      conversation_id:
        description: 可选：当前会话 ID，传入则注入该会话上下文
        type: integer
      message:
        description: 用户问题
        type: string
      scope:
        description: '"current"(默认) 或 "cross"(跨会话检索)'
        type: string
    required:
    - message
    type: object
  handler.ToolRegistryConfigRequest:
    properties:
      enabled:
        type: boolean
    required:
    - enabled
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: QIM Team
  description: QIM 智能办公平台后端 API 文档
  title: QIM Server API
  version: "2.0"
paths:
  /api/ai/summary/stream:
    post:
      consumes:
      - application/json
      description: 根据对话记录流式生成会话摘要，使用 SSE 返回
      parameters:
      - description: 摘要请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.GenerateSummaryRequest'
      produces:
      - text/event-stream
      responses: {}
      summary: 流式生成会话摘要
      tags:
      - AI
  /api/v1/admin/ai/dashboard:
    get:
      description: 获取AI运维面板的统计数据
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            $ref: '#/definitions/handler.AIResponse'
      summary: 运维面板数据
      tags:
      - AI
  /api/v1/admin/ai/router:
    delete:
      description: 删除 DB 路由覆盖并热更新回 config.yaml 配置，无需重启
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 恢复 config.yaml 默认路由
      tags:
      - AI
    get:
      description: 返回当前生效路由（DB 覆盖优先，否则 config.yaml 默认）；同时返回已配置供应商作为 provider 下拉候选
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取 AI 模型路由
      tags:
      - AI
    put:
      consumes:
      - application/json
      description: 将任务→provider/model 路由写入 SystemConfig 并热更新 AIService，无需重启
      parameters:
      - description: 路由配置 {defaultTask, routes}
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 保存 AI 模型路由
      tags:
      - AI
  /api/v1/admin/knowledge-graph:
    get:
      consumes:
      - application/json
      description: 获取指定集合的知识图谱节点和关系数据
      parameters:
      - description: 集合名称
        in: query
        name: collection
        required: true
        type: string
      - description: 搜索查询
        in: query
        name: query
        type: string
      - description: 最大节点数
        in: query
        name: max_nodes
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            $ref: '#/definitions/handler.AIResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handler.AIResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/handler.AIResponse'
      summary: 获取知识图谱数据
      tags:
      - 知识图谱
  /api/v1/admin/tool-registry/tools:
    get:
      description: 列出所有 AI 工具及其启用状态，用于管理后台配置
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            $ref: '#/definitions/handler.AIResponse'
      summary: 列出所有 AI 工具（管理后台）
      tags:
      - AI工具管理
  /api/v1/admin/tool-registry/tools/{tool_name}:
    put:
      consumes:
      - application/json
      description: 启用或禁用指定的 AI 工具
      parameters:
      - description: 工具名称
        in: path
        name: tool_name
        required: true
        type: string
      - description: 工具配置请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ToolRegistryConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            $ref: '#/definitions/handler.AIResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handler.AIResponse'
        "404":
          description: 工具不存在
          schema:
            $ref: '#/definitions/handler.AIResponse'
      summary: 更新 AI 工具配置
      tags:
      - AI工具管理
  /api/v1/ai/completion:
    post:
      consumes:
      - application/json
      description: 根据消息获取AI完成
      parameters:
      - description: AI完成请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.GetCompletionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            $ref: '#/definitions/handler.AIResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handler.AIResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/handler.AIResponse'
      summary: 获取AI完成
      tags:
      - AI
  /api/v1/ai/completion/stream:
    post:
      consumes:
      - application/json
      description: 流式获取AI完成，使用服务器发送事件(SSE)返回统一JSON格式
      parameters:
      - description: AI完成请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.GetCompletionRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 流式输出
          schema:
            type: string
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handler.AIResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/handler.AIResponse'
      summary: 流式获取AI完成
      tags:
      - AI
  /api/v1/ai/draft-reply:
    post:
      consumes:
      - application/json
      description: 根据目标消息及上下文生成回复草稿
      parameters:
      - description: 起草请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.DraftReplyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            $ref: '#/definitions/handler.AIResponse'
      summary: 帮我回复
      tags:
      - AI
  /api/v1/ai/draft-reply/stream:
    post:
      consumes:
      - application/json
      description: 根据目标消息及上下文流式生成回复草稿，使用 SSE 返回
      parameters:
      - description: 起草请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.DraftReplyRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 流式输出
          schema:
            type: string
      summary: 流式帮我回复
      tags:
      - AI
  /api/v1/ai/sidebar/stream:
    post:
      consumes:
      - application/json
      description: |-
        在任意会话旁边随时问 AI，不改变对话本身的社交动态。
        scope=current: 注入当前会话最近消息作为上下文；
        scope=cross: 跨会话检索用户全部消息/笔记/知识库后综合回答。
      parameters:
      - description: 侧边栏请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SidebarStreamRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 流式输出
          schema:
            type: string
      summary: 侧边栏 AI 元对话
      tags:
      - AI
  /api/v1/ai/tools:
    get:
      description: 列出所有可用的 AI 工具
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            $ref: '#/definitions/handler.AIResponse'
      summary: 列出所有 AI 工具
      tags:
      - AI
  /api/v1/cli/download:
    get:
      parameters:
      - description: 目标操作系统（默认按请求检测）
        in: query
        name: os
        type: string
      - description: 目标架构（默认按请求检测）
        in: query
        name: arch
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      summary: CLI 二进制下载
      tags:
      - CLI
  /api/v1/cli/version:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
              type: object
      summary: CLI 版本查询
      tags:
      - CLI
  /api/v1/notes/{id}/access:
    patch:
      consumes:
      - application/json
      description: 打开后笔记向量化进分身知识库集合，关闭后移除该笔记向量
      parameters:
      - description: 笔记ID
        in: path
        name: id
        required: true
        type: integer
      - description: 可见性开关
        in: body
        name: request
        required: true
        schema:
          properties:
            ai_accessible:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 更新后的笔记
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 笔记不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 切换笔记「允许分身读取」状态
      tags:
      - 笔记
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
