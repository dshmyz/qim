# QIM Server 配置文件
#
# 环境变量说明:
# - JWT_SECRET: JWT密钥（与下方 jwt.secret 等价，环境变量优先），建议设置为随机字符串
# - QIM_ADMIN_USERNAME: 管理员用户名（默认: admin）
# - QIM_ADMIN_PASSWORD: 管理员密码（默认: admin123）
# - LOG_DIR / LOG_LEVEL: 日志目录与级别（优先于下方 log 配置）
#
# 注意：首次启动时会自动创建管理员账户，建议在生产环境中修改默认密码

# 服务器配置
server:
  port: "8080"
  mode: "release"  # debug / release / test

# 数据初始化策略（不同环境可有不同策略）
data_init:
  preset_data: true       # 预置数据（系统用户、管理员、内置应用、文件上传配置）
  bot_templates: true     # Bot 模板（系统助手、AI助手）
  test_data: false        # 测试数据（测试用户、部门、会话、频道等）
  seed_force: false       # 是否强制重新初始化（演示环境可设为 true）

# JWT 配置
jwt:
  secret: "${QIM_JWT_SECRET:change-me-to-random-string}"
  expire: 7200  # 秒
  refresh_expire_days: 7

# 数据库配置
database:
  type: "sqlite"  # sqlite / mysql / postgresql
  path: "./qim.db"
  # MySQL/PostgreSQL 配置示例:
  # host: "localhost"
  # port: 3306
  # username: "root"
  # password: "your-password"
  # database: "qim_server"

# 日志配置：设置 dir 后输出拆分到 stdout + qim.log/error.log/auth.log 并按轮转策略归档；
# 环境变量 LOG_DIR / LOG_LEVEL 始终优先于此配置，不设置 dir 则仅输出到 stdout。
log:
  dir: "./logs"
  level: "info"        # debug / info / warn / error
  # 以下为轮转策略默认值（不填则自动使用下述值，无需显式配置）：
  # max_size_mb: 100
  # max_backups: 14
  # max_age_days: 30
  # compress: true

# 多节点配置
cluster:
  enabled: false
  nodes: []
  # - "http://node1:8080"
  # - "http://node2:8080"
  scheme: "http"

# 节点间认证：NodeAuthMiddleware 使用该密钥校验节点间内部接口请求（Header: Node-Secret）
# 注意：node.secret 仅从配置文件读取，不支持环境变量覆盖。
node:
  secret: "change-me-to-random-node-secret"

# 文件存储配置
storage:
  type: "local"   # local 或 s3
  local:
    path: "./uploads"
  # S3 存储配置（storage.type: "s3" 时生效）：
  # s3:
  #   endpoint: "s3.amazonaws.com"
  #   access_key: "your-access-key"
  #   secret_key: "your-secret-key"
  #   bucket: "qim"
  #   region: "us-east-1"
  #   use_ssl: true

# AI 配置
ai:
  # 路由配置：管理后台可在线修改，此处仅填初始值
  # 完整任务类型：chat / intent_recognition / analysis / embedding / tool_calling / search / digest / vision
  router:
    default_task: "chat"
    routes:
      chat:
        provider: "openai"
        model: "gpt-3.5-turbo"
      embedding:
        provider: "openai"
        model: "text-embedding-ada-002"

  # 通用配置
  max_tokens: 1000
  temperature: 0.7

  # Provider 配置：未配置 api_key 的 provider 不会初始化，管理后台可添加更多 provider
  openai:
    api_key: "your-openai-api-key"
    model: "gpt-3.5-turbo"
    base_url: "https://api.openai.com/v1"
    embedding_model: "text-embedding-ada-002"

  anthropic:
    api_key: ""
    model: "claude-sonnet-4-20250514"
    base_url: "https://api.anthropic.com/v1"

  # 其他 provider 未列出的字段均为空，可通过管理后台启用：
  # baidu / alibaba / tencent / bytedance / deepseek

# CORS 配置
cors:
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"

# WebSocket 配置：与 CORS 类似，控制 WS 握手时允许的来源
ws:
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"

# 向量数据库配置（用于 RAG 和知识图谱）
vector:
  path: "./vector.db"

# 外部 MCP 客户端网关配置（管理员在管理后台配置外部 MCP Server 连接）
# SSRF 防护默认开启：仅允许公网 http/https 地址，禁止 localhost/私网 IP。
# 内网部署时若外部 MCP Server 位于私网地址，请将 allow_private 设为 true 放开地址限制
#（仍只允许 http/https 协议）。仅建议在可信内网环境开启。
mcp:
  allow_private: false

# 静态资源路径配置（未配置时使用默认值，也可用环境变量覆盖）
static:
  uploads_dir: "uploads"
  miniapps_dir: "static/miniapps"
